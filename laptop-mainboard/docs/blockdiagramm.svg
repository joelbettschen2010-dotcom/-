<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a8699"/>
    </marker>
  </defs>
  <style>
    .box{fill:#f4f6fa;stroke:#39445a;stroke-width:1.5;rx:8}
    .hl{fill:#e8f0fe;stroke:#1a56c4;stroke-width:2}
    .pw{fill:#fdf1e2;stroke:#c07a1c;stroke-width:1.5}
    .t{fill:#1c2333;font-size:14px;font-weight:bold}
    .s{fill:#4a566e;font-size:11px}
    .e{stroke:#7a8699;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .el{fill:#5a6478;font-size:10px}
  </style>
  <text x="480" y="26" text-anchor="middle" class="t" font-size="18">Laptop-Mainboard 15.6&#8243; — AM5 gesockelt, chipsatzlos</text>

  <!-- SoC -->
  <rect x="380" y="200" width="200" height="150" rx="10" class="hl"/>
  <text x="480" y="228" text-anchor="middle" class="t">Ryzen 5 8600G</text>
  <text x="480" y="248" text-anchor="middle" class="s">AM5-Sockel LGA-1718</text>
  <text x="480" y="266" text-anchor="middle" class="s">Zen 4 · 6C/12T · x86-64</text>
  <text x="480" y="284" text-anchor="middle" class="s">Radeon 760M iGPU</text>
  <text x="480" y="302" text-anchor="middle" class="s">cTDP 35–45 W (Eco)</text>
  <text x="480" y="330" text-anchor="middle" class="s" font-style="italic">kein Chipsatz — alle I/O direkt</text>

  <!-- RAM -->
  <rect x="390" y="60" width="180" height="46" rx="8" class="box"/>
  <text x="480" y="80" text-anchor="middle" class="t" font-size="13">2× DDR5 SO-DIMM</text>
  <text x="480" y="97" text-anchor="middle" class="s">2 Kanäle · bis DDR5-5600</text>
  <path class="e" d="M455,200 455,106"/><path class="e" d="M505,200 505,106"/>
  <text x="512" y="150" class="el">Kanal A/B</text>

  <!-- Storage -->
  <rect x="680" y="52" width="230" height="66" rx="8" class="box"/>
  <text x="795" y="74" text-anchor="middle" class="t" font-size="13">2× M.2 NVMe 2280</text>
  <text x="795" y="92" text-anchor="middle" class="s">je PCIe 4.0 ×4</text>
  <text x="795" y="108" text-anchor="middle" class="s">+ M.2 2230 WLAN (×1 + USB2)</text>
  <path class="e" d="M580,220 680,95"/>
  <text x="612" y="140" class="el">2× x4 + x1</text>

  <!-- Thunderbolt -->
  <rect x="680" y="150" width="230" height="80" rx="8" class="hl"/>
  <text x="795" y="172" text-anchor="middle" class="t" font-size="13">Intel JHL8540 — Thunderbolt 4</text>
  <text x="795" y="190" text-anchor="middle" class="s">2× USB-C 40G mittig rechts (wie Original)</text>
  <text x="795" y="207" text-anchor="middle" class="s">PCIe ×4 Uplink · 2× DP-1.4-Sink</text>
  <text x="795" y="223" text-anchor="middle" class="s">TPS65988 Dual-PD-Controller</text>
  <path class="e" d="M580,250 680,200"/>
  <text x="600" y="215" class="el">x4 + 2×DP</text>

  <!-- USB -->
  <rect x="680" y="248" width="230" height="50" rx="8" class="box"/>
  <text x="795" y="268" text-anchor="middle" class="t" font-size="13">2× USB-C 10G · 2× USB-A 5G</text>
  <text x="795" y="286" text-anchor="middle" class="s">HD3SS3220-Mux · VBUS-Schalter</text>
  <path class="e" d="M580,272 680,272"/>

  <!-- Video -->
  <rect x="680" y="316" width="230" height="50" rx="8" class="box"/>
  <text x="795" y="336" text-anchor="middle" class="t" font-size="13">HDMI 2.1 + eDP 1.4 intern</text>
  <text x="795" y="354" text-anchor="middle" class="s">15.6&#8243;-Panel · MP3389-Backlight</text>
  <path class="e" d="M580,320 680,338"/>

  <!-- Ethernet -->
  <rect x="60" y="150" width="230" height="60" rx="8" class="box"/>
  <text x="175" y="172" text-anchor="middle" class="t" font-size="13">USB-C-Ladeport 100W</text>
  <text x="175" y="190" text-anchor="middle" class="s">TPS65987D an der Barrel-Jack-Position</text>
  <text x="175" y="204" text-anchor="middle" class="s">Dead-Battery-Boot · 20 V/5 A</text>
  <path class="e" d="M380,235 290,190"/>
  <text x="310" y="200" class="el">x1 WLAN</text>

  <!-- Audio / SD / EC -->
  <rect x="60" y="240" width="230" height="60" rx="8" class="box"/>
  <text x="175" y="262" text-anchor="middle" class="t" font-size="13">Audio + SD + Webcam</text>
  <text x="175" y="280" text-anchor="middle" class="s">ALC256 · 3.5mm-AUX · Lautsprecher</text>
  <text x="175" y="294" text-anchor="middle" class="s">SD UHS-II (GL3224 an USB3)</text>
  <path class="e" d="M380,278 290,272"/>

  <rect x="60" y="330" width="230" height="60" rx="8" class="box"/>
  <text x="175" y="352" text-anchor="middle" class="t" font-size="13">EC ITE IT5570E</text>
  <text x="175" y="370" text-anchor="middle" class="s">Sequencing · Tastatur · Touchpad</text>
  <text x="175" y="384" text-anchor="middle" class="s">Akku-SMBus · 2× Lüfter · Lid</text>
  <path class="e" d="M380,320 290,355"/>
  <text x="322" y="345" class="el">eSPI</text>

  <!-- Power -->
  <rect x="60" y="440" width="380" height="80" rx="8" class="pw"/>
  <text x="250" y="463" text-anchor="middle" class="t" font-size="13">Laden &amp; Versorgung</text>
  <text x="250" y="482" text-anchor="middle" class="s">100W USB-PD (Ladeport) → TPS65987D → BQ25731 Buck-Boost</text>
  <text x="250" y="498" text-anchor="middle" class="s">NVDC · HP-Akku 3S / 56 Wh · +VSYS</text>
  <text x="250" y="513" text-anchor="middle" class="s">Bucks: 5V · 3.3V · 3.3V-ALW · 1.8V · 1.1V · 1.05V · 0.88V</text>

  <rect x="500" y="440" width="410" height="80" rx="8" class="pw"/>
  <text x="705" y="463" text-anchor="middle" class="t" font-size="13">CPU-VRM (SVI3)</text>
  <text x="705" y="482" text-anchor="middle" class="s">MP2857 + 6× MP86957 Smart-Stages</text>
  <text x="705" y="498" text-anchor="middle" class="s">VDDCR_CPU 4 Phasen · VDDCR_SOC 2 Phasen</text>
  <text x="705" y="513" text-anchor="middle" class="s">Polymer + MLCC-Arrays unter dem Sockel</text>
  <path class="e" d="M440,480 500,480"/>
  <path class="e" d="M620,440 540,350"/>
  <text x="590" y="405" class="el">VDDCR</text>
</svg>
