[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wx-multimodel"
version = "1.0.0"
description = "Multi-Modell-Wetter-CLI (Open-Meteo, keyless) mit Modellvergleich, Ensemble, Sparklines und HTML-Export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
wx = "wxcli.cli:main"

[tool.setuptools]
packages = ["wxcli"]
