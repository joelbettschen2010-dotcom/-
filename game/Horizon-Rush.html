<style>
/* ============================================================
   Horizon Rush – Oberfläche
   Dunkles Festival-Theme, Sonnenuntergang-Orange + Neon-Violett.
   Alles ohne externe Schriften/Bilder, damit es offline läuft.
   ============================================================ */

:root{
  --bg:#0a0b12;
  --bg2:#12142250;
  --card:#161a2b;
  --card2:#1d2238;
  --line:#2b3252;
  --txt:#eef1ff;
  --dim:#98a0c4;
  --acc:#ff6a1f;      /* Orange  */
  --acc2:#7b5cff;     /* Violett */
  --neon:#22e6c8;     /* Türkis  */
  --gold:#ffcc33;
  --bad:#ff3b5c;
  --ok:#39d98a;
  --r:18px;
  --ctrl-h:min(21vh,120px);   /* Höhe der Bedienflächen unten */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

html,body{
  margin:0;padding:0;height:100%;width:100%;
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;
}

#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;background:#05060c}

/* ---------------------------------------------------------- HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;
     padding:calc(8px + var(--safe-t)) calc(10px + var(--safe-r)) calc(8px + var(--safe-b)) calc(10px + var(--safe-l));
     display:flex;flex-direction:column}

.hud-top{display:flex;align-items:flex-start;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{background:rgba(10,12,22,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:4px 9px;line-height:1.15;
      display:flex;flex-direction:column;min-width:56px}
.chip .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.chip .v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.chip .v b{font-size:19px;color:var(--neon)}
#chipTime .v{color:#fff}

.icon-btn{pointer-events:auto;background:rgba(10,12,22,.55);border:1px solid rgba(255,255,255,.12);
  color:#fff;width:40px;height:40px;border-radius:12px;font-size:13px;font-weight:800;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.icon-btn:active{transform:scale(.94)}

#mini{width:78px;height:100px;flex:none;border-radius:14px;
  background:rgba(10,12,22,.45);border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

#popups{position:absolute;left:50%;top:22%;transform:translateX(-50%);
        display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.pop{font-size:15px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;
     text-shadow:0 2px 10px rgba(0,0,0,.85);animation:popUp 1.05s ease-out forwards}
@keyframes popUp{0%{opacity:0;transform:translateY(10px) scale(.85)}
                 18%{opacity:1;transform:translateY(0) scale(1.06)}
                 70%{opacity:1;transform:translateY(-8px) scale(1)}
                 100%{opacity:0;transform:translateY(-26px) scale(.96)}}

#bigMsg{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:clamp(34px,11vw,86px);
        font-weight:900;letter-spacing:.03em;color:#fff;text-shadow:0 4px 26px rgba(0,0,0,.8),0 0 40px rgba(255,106,31,.55);
        pointer-events:none}
#bigMsg.pulse{animation:pulse .6s ease-out}
@keyframes pulse{0%{transform:scale(1.5);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}

/* Tacho rechts oberhalb der Pedale – stört die Fahrbahnmitte nicht */
.hud-bottom{position:absolute;right:calc(16px + var(--safe-r));bottom:calc(var(--safe-b) + 84px);
  display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rev{width:150px;height:6px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}

<script>
/* ============================================================
   Horizon Rush – Kern
   Mathe-Helfer, Zufallsgenerator mit Saat, Speicherstand,
   Fahrzeugdaten, Tuning und Motorsound.
   ============================================================ */
window.HR = window.HR || {};
(function (HR) {
'use strict';

/* ---------------------------------------------------------- Mathe */
const U = HR.U = {
  clamp: (v, a, b) => v < a ? a : (v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  easeIn:    (a, b, p) => a + (b - a) * Math.pow(p, 2),
  easeOut:   (a, b, p) => a + (b - a) * (1 - Math.pow(1 - p, 2)),
  easeInOut: (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5),
  /* zyklisch weiterzählen (Position auf der Rundstrecke) */
  increase(start, inc, max) {
    let r = start + inc;
    while (r >= max) r -= max;
    while (r < 0) r += max;
    return r;
  },
  pctRemaining: (n, total) => (n % total) / total,
  /* 1:23.45 */
  fmtTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60), r = s - m * 60;
    return m + ':' + (r < 10 ? '0' : '') + r.toFixed(2);
  },
  fmtClock(s) {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60), r = Math.floor(s - m * 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  },
  fmtNum(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'"); },
  /* Farbmischung für Himmel/Nebel */
  mix(c1, c2, t) {
    const a = U.hex2rgb(c1), b = U.hex2rgb(c2);
    return 'rgb(' + Math.round(U.lerp(a[0], b[0], t)) + ',' +
                    Math.round(U.lerp(a[1], b[1], t)) + ',' +
                    Math.round(U.lerp(a[2], b[2], t)) + ')';
  },
  hex2rgb(h) {
    if (h[0] !== '#') { const m = h.match(/\d+/g); return [+m[0], +m[1], +m[2]]; }
    if (h.length === 4) h = '#' + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
    return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
  },
  shade(hex, f) {          /* f>0 heller, f<0 dunkler */
    const c = U.hex2rgb(hex);
    const g = v => Math.round(U.clamp(f > 0 ? v + (255 - v) * f : v * (1 + f), 0, 255));
    return 'rgb(' + g(c[0]) + ',' + g(c[1]) + ',' + g(c[2]) + ')';
  },
  rgba(hex, a) { const c = U.hex2rgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
};

/* ---------------------------------------------------------- Zufall mit Saat
   Gleiche Saat = exakt gleiche Strecke. Das macht Tagesrouten und
   das Wiederholen von Events möglich, ohne irgendetwas zu speichern. */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  s = String(s);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
HR.hashStr = hashStr;
HR.RNG = function (seed) {
  const r = mulberry32(typeof seed === 'string' ? hashStr(seed) : (seed >>> 0));
  const api = {
    next: r,
    range: (a, b) => a + r() * (b - a),
    int: (a, b) => Math.floor(a + r() * (b - a + 1)),
    pick: arr => arr[Math.floor(r() * arr.length)],
    chance: p => r() < p,
    sign: () => r() < 0.5 ? -1 : 1,
    /* [{w:3,v:'x'},…] */
    weighted(list) {
      let t = 0; for (const it of list) t += it.w;
      let x = r() * t;
      for (const it of list) { x -= it.w; if (x <= 0) return it.v; }
      return list[list.length - 1].v;
    },
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
      return arr;
    }
  };
  return api;
};

/* ---------------------------------------------------------- Fahrzeuge */
const CARS = HR.CARS = [

/* Tatsächliche Werte inkl. Tuning */
HR.effStats = function (carId) {
  const base = HR.carById(carId);
  const u = (HR.Save.data.cars[carId] && HR.Save.data.cars[carId].up) || { motor: 0, getriebe: 0, reifen: 0, turbo: 0 };
  return {
    top:  base.top  * (1 + 0.030 * u.motor),
    acc:  Math.min(0.99, base.acc  * (1 + 0.050 * u.getriebe + 0.022 * u.motor)),
    grip: Math.min(0.99, base.grip * (1 + 0.058 * u.reifen)),
    nos:  base.nos  * (1 + 0.10 * u.turbo),
    pi:   0
  };
};
/* Leistungsindex 100…999 – für Klassenvergleich und Gegnerstärke */
HR.perfIndex = function (carId) {
  const s = HR.effStats(carId);
  return Math.round(60 + (s.top - 180) * 1.55 + s.acc * 210 + s.grip * 150 + s.nos * 60);

/* ---------------------------------------------------------- Speicherstand */
const SAVE_KEY = 'horizonRush.save.v1';
const Save = HR.Save = {
  data: null,
  /* Manche Umgebungen (privater Modus, eingebettete Rahmen, lokale Dateien)
     sperren den Speicher. Dann laeuft das Spiel weiter, warnt aber und
     bietet die Sicherung per Code an. */
  available: (function () {
    try { localStorage.setItem('hr.t', '1'); localStorage.removeItem('hr.t'); return true; }
    catch (e) { return false; }
  })(),
  fresh() {
    return {
      seed: (Math.random() * 1e9) | 0,
      created: Date.now(),
      credits: 6000,
      xp: 0,
      level: 1,
      skill: 46,                       /* adaptive Gegnerstärke 0…100 */
      car: 'v88',
      cars: { v88: { up: { motor: 0, getriebe: 0, reifen: 0, turbo: 0 }, col: null } },
      events: {},                      /* id -> {stars, best} */
      best: {},                        /* modus/strecke -> Bestwert */
      daily: {},                       /* datum -> score */
      stats: { races: 0, wins: 0, km: 0, drift: 0, nearMiss: 0, topSpeed: 0, playtime: 0 },
      settings: { sound: true, steer: 'pad', autoGas: true, quality: 'auto', assist: true, rubber: true, aiBoost: 0 },
      seenIntro: false
    };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { d = null; }
    const f = this.fresh();
    if (!d || typeof d !== 'object') { this.data = f; this.save(); return this.data; }
    /* fehlende Felder aus dem Standard ergänzen (Vorwärtskompatibilität) */
    const merge = (dst, src) => {
      for (const k in src) {
        if (dst[k] === undefined || dst[k] === null) dst[k] = src[k];
        else if (typeof src[k] === 'object' && !Array.isArray(src[k]) && typeof dst[k] === 'object') merge(dst[k], src[k]);
      }
      return dst;
    };
    this.data = merge(d, f);
    if (!this.data.cars[this.data.car]) this.data.car = 'v88';
    return this.data;
  },
  save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); this.available = true; }
    catch (e) { this.available = false; }
  },
  reset() { this.data = this.fresh(); this.save(); },

  /* ---- Sicherung als Text-Code, geraeteunabhaengig ---- */
  exportCode() {
    const json = JSON.stringify(this.data);
    return 'HR1.' + btoa(unescape(encodeURIComponent(json)));
  },
  importCode(code) {
    code = String(code || '').trim().replace(/\s+/g, '');
    if (code.indexOf('HR1.') !== 0) return 'Das ist kein Horizon-Rush-Code (er beginnt mit HR1.).';
    let obj;
    try { obj = JSON.parse(decodeURIComponent(escape(atob(code.slice(4))))); }
    catch (e) { return 'Der Code ist unvollständig oder beschädigt.'; }
    if (!obj || typeof obj !== 'object' || !obj.cars || typeof obj.credits !== 'number')
      return 'Der Code enthält keinen gültigen Spielstand.';
    this.data = obj;
    /* fehlende Felder aus dem Standard ergaenzen */
    const f = this.fresh();
    const merge = (dst, src) => {
      for (const k in src) {
        if (dst[k] === undefined || dst[k] === null) dst[k] = src[k];
        else if (typeof src[k] === 'object' && !Array.isArray(src[k]) && typeof dst[k] === 'object') merge(dst[k], src[k]);
      }
    };
    merge(this.data, f);
    if (!this.data.cars[this.data.car]) this.data.car = 'v88';
    this.save();
    return null;
  },

  addCredits(n) { this.data.credits = Math.max(0, Math.round(this.data.credits + n)); this.save(); },
  /* gibt zurück, wie viele Stufen aufgestiegen wurde */
  addXP(n) {
    const d = this.data;
    d.xp += Math.round(n);
    let up = 0;
    while (d.xp >= HR.xpForLevel(d.level)) { d.xp -= HR.xpForLevel(d.level); d.level++; up++; }
    this.save();
    return up;
  },
  owns(id) { return !!this.data.cars[id]; },
  buyCar(id) {
    const c = HR.carById(id);
    if (this.owns(id) || this.data.credits < c.price) return false;
    this.data.credits -= c.price;
    this.data.cars[id] = { up: { motor: 0, getriebe: 0, reifen: 0, turbo: 0 }, col: null };
    this.data.car = id;
    this.save();
    return true;
  }
};
HR.xpForLevel = lvl => Math.round(420 + lvl * 260 + lvl * lvl * 26);

/* ---------------------------------------------------------- Ton
   Reiner Synthesizer – keine Audiodateien, damit alles offline läuft.
   iOS erlaubt Ton erst nach einer Berührung: init() aus einem Tap heraus. */
const Audio2 = HR.Audio = {
  ctx: null, ready: false, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const ctx = this.ctx = new AC();
      const master = this.master = ctx.createGain();
      master.gain.value = 0.55; master.connect(ctx.destination);

      /* Motor: zwei Oszillatoren durch ein Tiefpassfilter */
      const eg = this.eg = ctx.createGain(); eg.gain.value = 0;
      const ef = this.ef = ctx.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 760; ef.Q.value = 5;
      eg.connect(ef); ef.connect(master);
      const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
      const o2 = ctx.createOscillator(); o2.type = 'square';   o2.frequency.value = 27.5;
      const g2 = ctx.createGain(); g2.gain.value = 0.45;
      o1.connect(eg); o2.connect(g2); g2.connect(eg);
      o1.start(); o2.start(); this.o1 = o1; this.o2 = o2;

      /* Fahrtwind / Reifen: gefiltertes Rauschen */
      const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const dat = buf.getChannelData(0);
      for (let i = 0; i < dat.length; i++) dat[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const nf = this.nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 900; nf.Q.value = 0.6;
      const ng = this.ng = ctx.createGain(); ng.gain.value = 0;
      src.connect(nf); nf.connect(ng); ng.connect(master); src.start();

      this.ready = true;
    } catch (e) { this.ready = false; }
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.55;
  },
  /* rpm 0…1, load 0…1 (Gas), extra: NOS */
  engine(rpm, load, on, nos) {
    if (!this.ready || this.muted) return;
    const t = this.ctx.currentTime;
    const f = 46 + rpm * 210 + (nos ? 26 : 0);
    this.o1.frequency.setTargetAtTime(f, t, 0.05);
    this.o2.frequency.setTargetAtTime(f * 0.5, t, 0.05);
    this.ef.frequency.setTargetAtTime(430 + rpm * 1500 + load * 500, t, 0.08);
    this.eg.gain.setTargetAtTime(on ? (0.055 + load * 0.10 + rpm * 0.05) : 0, t, 0.10);
  },
  wind(v, screech) {
    if (!this.ready || this.muted) return;
    const t = this.ctx.currentTime;
    this.nf.frequency.setTargetAtTime(screech ? 2400 : (500 + v * 1500), t, 0.08);
    this.nf.Q.setTargetAtTime(screech ? 6 : 0.6, t, 0.08);
    this.ng.gain.setTargetAtTime(v * 0.05 + (screech ? 0.075 : 0), t, 0.09);
  },
  stopEngine() { if (this.ready) { this.eg.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1); this.ng.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1); } },
  /* kurzer Ton */
  blip(freq, dur, type, vol) {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol == null ? 0.18 : vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.14));
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + (dur || 0.14) + 0.03);
  },
  ui() { this.blip(660, 0.08, 'triangle', 0.10); },
  ok() { this.blip(880, 0.10, 'triangle', 0.13); setTimeout(() => this.blip(1320, 0.12, 'triangle', 0.11), 80); },
  countdown(last) { this.blip(last ? 1100 : 620, last ? 0.42 : 0.16, 'square', 0.14); },
  checkpoint() { this.blip(1046, 0.09, 'triangle', 0.14); setTimeout(() => this.blip(1568, 0.16, 'triangle', 0.12), 70); },
  crash() {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = ctx.createGain(); g.gain.value = 0.32;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  nosBurst() {
    if (!this.ready || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.setValueAtTime(400, t);
    f.frequency.exponentialRampToValueAtTime(4000, t + 0.45);
    const g = ctx.createGain(); g.gain.value = 0.16;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  }
};

/* ============================================================
   Horizon Rush – Grafik-Fabrik
   Alle Sprites werden zur Laufzeit gezeichnet (keine Bilddateien),
   damit die App komplett offline und in wenigen KB läuft.
   ============================================================ */
(function (HR) {
'use strict';
const U = HR.U;

function cvs(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
  return c;
}
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
/* Sprite-Hülle: worldW = Breite in Vielfachen der Strassenbreite */
function sprite(c, worldW) { return { c: c, w: c.width, h: c.height, worldW: worldW }; }

const Art = HR.Art = {};

/* ---------------------------------------------------------- Fahrzeug (Heckansicht) */
const BODIES = {
  hatch:  { baseW: .84, roofW: .56, glassY: .40, spoiler: 0, tail: .10, height: .62 },
  coupe:  { baseW: .88, roofW: .52, glassY: .44, spoiler: 1, tail: .09, height: .58 },
  rally:  { baseW: .86, roofW: .58, glassY: .38, spoiler: 2, tail: .11, height: .64 },
  muscle: { baseW: .92, roofW: .54, glassY: .47, spoiler: 1, tail: .08, height: .54 },
  super:  { baseW: .94, roofW: .46, glassY: .52, spoiler: 2, tail: .07, height: .48 },
  proto:  { baseW: .96, roofW: .40, glassY: .56, spoiler: 3, tail: .06, height: .44 },
  van:    { baseW: .80, roofW: .74, glassY: .26, spoiler: 0, tail: .10, height: .80 },
  truck:  { baseW: .94, roofW: .90, glassY: .18, spoiler: 0, tail: .09, height: .92 }
};

/* col = Lackfarbe, lean = -1|0|1 (Lenkeinschlag), brake = Bremslicht an */
Art.car = function (col, body, lean, brake) {
  const B = BODIES[body] || BODIES.coupe;
  const W = 240, H = 140;
  const c = cvs(W, H), g = c.getContext('2d');
  const cx = W / 2;
  const ground = H * 0.94;
  const bw = W * B.baseW;                       /* Karosseriebreite unten */
  const topY = ground - H * B.height;           /* Dachhöhe */
  const roofW = W * B.roofW;
  const shift = (lean || 0) * W * 0.030;        /* oberer Teil kippt beim Lenken */
  const sq = 1 - Math.abs(lean || 0) * 0.05;

  /* Schatten */
  g.save();
  g.globalAlpha = 0.42; g.fillStyle = '#000';
  g.beginPath(); g.ellipse(cx, ground + 3, bw * 0.56, H * 0.055, 0, 0, Math.PI * 2); g.fill();
  g.restore();

  /* Räder */
  const wheelH = H * 0.20, wheelW = W * 0.115;
  g.fillStyle = '#15161c';
  rr(g, cx - bw / 2 * sq - wheelW * 0.30, ground - wheelH, wheelW, wheelH, 4); g.fill();
  rr(g, cx + bw / 2 * sq - wheelW * 0.70, ground - wheelH, wheelW, wheelH, 4); g.fill();
  g.fillStyle = '#31343f';
  g.fillRect(cx - bw / 2 * sq - wheelW * 0.30, ground - wheelH * 0.55, wheelW, 3);
  g.fillRect(cx + bw / 2 * sq - wheelW * 0.70, ground - wheelH * 0.55, wheelW, 3);

  /* Karosserie: unten breit, oben schmales Dach, mit Schulterkante */
  const shoulderY = ground - H * (B.glassY + 0.02);
  const grad = g.createLinearGradient(0, topY, 0, ground);
  grad.addColorStop(0, U.shade(col, 0.34));
  grad.addColorStop(0.42, col);
  grad.addColorStop(1, U.shade(col, -0.45));
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(cx - bw / 2 * sq, ground);
  g.lineTo(cx - bw / 2 * sq, shoulderY);
  g.quadraticCurveTo(cx - bw / 2 * sq * 0.94, topY + H * 0.02, cx - roofW / 2 * sq + shift, topY);
  g.lineTo(cx + roofW / 2 * sq + shift, topY);
  g.quadraticCurveTo(cx + bw / 2 * sq * 0.94, topY + H * 0.02, cx + bw / 2 * sq, shoulderY);
  g.lineTo(cx + bw / 2 * sq, ground);
  g.closePath(); g.fill();
  /* Schulterkante als heller Strich */
  g.strokeStyle = U.rgba('#ffffff', 0.13); g.lineWidth = 2;
  g.beginPath(); g.moveTo(cx - bw / 2 * sq + 2, shoulderY); g.lineTo(cx + bw / 2 * sq - 2, shoulderY); g.stroke();

  /* Heckscheibe */
  const gy = ground - H * B.glassY;
  const gg = g.createLinearGradient(0, topY, 0, gy);
  gg.addColorStop(0, 'rgba(150,190,230,.30)'); gg.addColorStop(1, 'rgba(8,12,24,.92)');
  g.fillStyle = gg;
  g.beginPath();
  g.moveTo(cx - roofW / 2 * sq * 0.92 + shift, topY + H * 0.022);
  g.lineTo(cx + roofW / 2 * sq * 0.92 + shift, topY + H * 0.022);
  g.lineTo(cx + roofW / 2 * sq * 1.16 + shift * 0.5, gy);
  g.lineTo(cx - roofW / 2 * sq * 1.16 + shift * 0.5, gy);
  g.closePath(); g.fill();

  /* Glanzkante oben */
  g.strokeStyle = 'rgba(255,255,255,.42)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(cx - roofW / 2 * sq + shift, topY + 1); g.lineTo(cx + roofW / 2 * sq + shift, topY + 1); g.stroke();

  /* Rückleuchten */
  const ty = ground - H * 0.30, th = H * B.tail * 1.6, tw = bw * 0.24;
  const lit = brake ? '#ff2a2a' : '#c31228';
  g.save();
  g.shadowColor = brake ? 'rgba(255,40,40,.95)' : 'rgba(220,20,50,.55)';
  g.shadowBlur = brake ? 22 : 9;
  g.fillStyle = lit;
  rr(g, cx - bw / 2 + bw * 0.06, ty, tw, th, 3); g.fill();
  rr(g, cx + bw / 2 - bw * 0.06 - tw, ty, tw, th, 3); g.fill();
  g.restore();
  if (B.spoiler >= 2) {   /* durchgehendes Leuchtband bei Sportwagen */
    g.save(); g.globalAlpha = brake ? 0.95 : 0.5; g.fillStyle = lit;
    g.shadowColor = 'rgba(255,40,60,.8)'; g.shadowBlur = brake ? 16 : 6;
    g.fillRect(cx - bw / 2 + bw * 0.06, ty + th * 0.3, bw * 0.88, th * 0.26);
    g.restore();
  }

  /* Stossfänger / Diffusor */
  g.fillStyle = 'rgba(12,14,20,.88)';
  rr(g, cx - bw / 2 * 0.96, ground - H * 0.115, bw * 0.96, H * 0.10, 4); g.fill();
  g.fillStyle = 'rgba(200,210,225,.55)';
  rr(g, cx - bw * 0.10, ground - H * 0.095, bw * 0.20, H * 0.045, 2); g.fill();   /* Kennzeichen */
  /* Auspuff */
  g.fillStyle = '#4b5060';
  g.fillRect(cx - bw * 0.30, ground - H * 0.055, bw * 0.07, H * 0.022);
  g.fillRect(cx + bw * 0.23, ground - H * 0.055, bw * 0.07, H * 0.022);

  /* Heckflügel */
  if (B.spoiler > 0) {
    const swY = topY - H * (B.spoiler === 3 ? 0.10 : B.spoiler === 2 ? 0.07 : 0.035);
    const sw = bw * (B.spoiler === 3 ? 1.02 : 0.92);
    g.fillStyle = U.shade(col, -0.55);
    g.fillRect(cx - bw * 0.30 + shift, swY, W * 0.022, topY - swY + 4);
    g.fillRect(cx + bw * 0.28 + shift, swY, W * 0.022, topY - swY + 4);
    const sg = g.createLinearGradient(0, swY, 0, swY + H * 0.045);
    sg.addColorStop(0, U.shade(col, 0.18)); sg.addColorStop(1, U.shade(col, -0.42));
    g.fillStyle = sg;
    rr(g, cx - sw / 2 + shift, swY, sw, H * 0.042, 3); g.fill();
  }
  return sprite(c, body === 'truck' ? 0.36 : body === 'van' ? 0.31 : 0.285);
};

/* ---------------------------------------------------------- Bäume & Landschaft */
Art.pine = function (rng, dark, snow) {
  const W = 150, H = 300;
  const c = cvs(W, H), g = c.getContext('2d');
  const cx = W / 2;
  g.fillStyle = '#3b2a1c';
  g.fillRect(cx - 8, H * 0.80, 16, H * 0.20);
  const layers = 5;
  for (let i = 0; i < layers; i++) {
    const t = i / (layers - 1);
    const y = U.lerp(H * 0.86, H * 0.06, t);
    const w = U.lerp(W * 0.48, W * 0.13, t);
    const hh = H * 0.20;
    g.fillStyle = U.mix(dark ? '#123322' : '#1f6b34', dark ? '#0a1f14' : '#2f8f45', t * 0.7 + rng.range(-0.1, 0.1));
    g.beginPath(); g.moveTo(cx, y - hh); g.lineTo(cx + w, y + 6); g.lineTo(cx - w, y + 6); g.closePath(); g.fill();
    if (snow) {
      g.fillStyle = 'rgba(238,246,255,.85)';
      g.beginPath(); g.moveTo(cx, y - hh); g.lineTo(cx + w * 0.55, y - hh * 0.20); g.lineTo(cx - w * 0.55, y - hh * 0.20); g.closePath(); g.fill();
    }
  }
  return sprite(c, rng.range(0.55, 0.85));
};

Art.broadleaf = function (rng, tint) {
  const W = 190, H = 240;
  const c = cvs(W, H), g = c.getContext('2d');
  const cx = W / 2;
  g.strokeStyle = '#4a3520'; g.lineWidth = 13; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx, H); g.lineTo(cx + rng.range(-8, 8), H * 0.56); g.stroke();
  const base = tint || '#2f7a3a';
  for (let i = 0; i < 9; i++) {
    const a = rng.range(0, Math.PI * 2), r = rng.range(0, W * 0.24);
    const x = cx + Math.cos(a) * r, y = H * 0.36 + Math.sin(a) * r * 0.72;
    const rad = rng.range(W * 0.16, W * 0.27);
    g.fillStyle = U.mix(base, '#8fd070', rng.range(0, 0.45));
    g.beginPath(); g.ellipse(x, y, rad, rad * 0.86, 0, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 0.25; g.fillStyle = '#04120a';
  g.beginPath(); g.ellipse(cx, H * 0.46, W * 0.34, H * 0.16, 0, 0, Math.PI * 2); g.fill();
  return sprite(c, rng.range(0.6, 0.95));
};

Art.palm = function (rng) {
  const W = 200, H = 300;
  const c = cvs(W, H), g = c.getContext('2d');
  const cx = W / 2, bend = rng.range(-26, 26);
  g.strokeStyle = '#6a5233'; g.lineWidth = 12; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx, H); g.quadraticCurveTo(cx + bend * 0.6, H * 0.55, cx + bend, H * 0.24); g.stroke();
  g.strokeStyle = '#7d6440'; g.lineWidth = 3;
  for (let i = 0; i < 7; i++) { const t = i / 7; const y = U.lerp(H, H * 0.28, t); g.beginPath(); g.moveTo(cx + bend * (1 - Math.pow(1 - t, 2)) - 7, y); g.lineTo(cx + bend * (1 - Math.pow(1 - t, 2)) + 7, y); g.stroke(); }
  const tx = cx + bend, ty = H * 0.24;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + rng.range(-0.2, 0.2);
    const len = rng.range(W * 0.28, W * 0.44);
    g.strokeStyle = U.mix('#1d7a48', '#4fd07a', rng.range(0, 0.6));
    g.lineWidth = rng.range(7, 13);
    g.beginPath(); g.moveTo(tx, ty);
    g.quadraticCurveTo(tx + Math.cos(a) * len * 0.6, ty + Math.sin(a) * len * 0.35 - 20,
                       tx + Math.cos(a) * len, ty + Math.sin(a) * len * 0.55 + 12);
    g.stroke();
  }
  g.fillStyle = '#6b4a22';
  g.beginPath(); g.arc(tx, ty + 6, 9, 0, Math.PI * 2); g.fill();
  return sprite(c, rng.range(0.7, 1.0));
};

Art.cactus = function (rng) {
  const W = 130, H = 220;
  const c = cvs(W, H), g = c.getContext('2d');
  const cx = W / 2;
  const col = U.mix('#2f7a4a', '#5aa05e', rng.range(0, 0.5));
  g.fillStyle = col;
  rr(g, cx - 17, H * 0.20, 34, H * 0.80, 17); g.fill();
  if (rng.chance(0.75)) { rr(g, cx - 52, H * 0.42, 26, H * 0.30, 13); g.fill(); rr(g, cx - 52, H * 0.42, 60, 24, 12); g.fill(); }
  if (rng.chance(0.6)) { rr(g, cx + 27, H * 0.34, 25, H * 0.34, 12); g.fill(); rr(g, cx - 6, H * 0.56, 58, 23, 11); g.fill(); }
  g.strokeStyle = 'rgba(0,0,0,.20)'; g.lineWidth = 2;
  for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(cx - 10 + i * 10, H * 0.24); g.lineTo(cx - 10 + i * 10, H * 0.97); g.stroke(); }

Art.rock = function (rng, col) {
  const W = 180, H = 130;
  const c = cvs(W, H), g = c.getContext('2d');
  const base = col || '#6d6a63';
  g.fillStyle = base;
  g.beginPath();
  const n = 8; g.moveTo(6, H);
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    g.lineTo(6 + t * (W - 12), H - Math.sin(t * Math.PI) * H * rng.range(0.62, 0.98) * (0.7 + 0.3 * Math.sin(t * 9)));
  }
  g.lineTo(W - 6, H); g.closePath(); g.fill();
  g.fillStyle = U.shade(base, 0.22);
  g.beginPath(); g.moveTo(W * 0.2, H); g.lineTo(W * 0.42, H * 0.22); g.lineTo(W * 0.55, H); g.closePath(); g.fill();
  return sprite(c, rng.range(0.35, 0.62));
};

Art.bush = function (rng, col) {
  const W = 120, H = 80;

/* Werbetafel im Festival-Look */

/* Warnschild für Kurven */
Art.sign = function (dir) {
  const W = 120, H = 190;
  const c = cvs(W, H), g = c.getContext('2d');
  g.fillStyle = '#5b6070'; g.fillRect(W / 2 - 5, H * 0.5, 10, H * 0.5);
  g.fillStyle = '#0d1020'; rr(g, 8, 8, W - 16, H * 0.5, 8); g.fill();
  g.strokeStyle = '#ffcc33'; g.lineWidth = 5; rr(g, 8, 8, W - 16, H * 0.5, 8); g.stroke();
  g.fillStyle = '#ffcc33';
  for (let i = 0; i < 2; i++) {
    const x = W / 2 + (i - 0.5) * 30 * (dir < 0 ? -1 : 1);
    g.beginPath();
    if (dir < 0) { g.moveTo(x + 14, H * 0.16); g.lineTo(x - 8, H * 0.33); g.lineTo(x + 14, H * 0.50); g.lineTo(x + 20, H * 0.42); g.lineTo(x + 4, H * 0.33); g.lineTo(x + 20, H * 0.24); }
    else { g.moveTo(x - 14, H * 0.16); g.lineTo(x + 8, H * 0.33); g.lineTo(x - 14, H * 0.50); g.lineTo(x - 20, H * 0.42); g.lineTo(x - 4, H * 0.33); g.lineTo(x - 20, H * 0.24); }
    g.closePath(); g.fill();
  }
  return sprite(c, 0.30);
};

/* Hochhaus mit beleuchteten Fenstern */
Art.building = function (rng, night) {
  const W = 220, H = rng.int(240, 460);
  const c = cvs(W, H), g = c.getContext('2d');
  const bw = rng.range(W * 0.55, W * 0.92), x0 = (W - bw) / 2;
  const bg = g.createLinearGradient(x0, 0, x0 + bw, 0);
  bg.addColorStop(0, night ? '#141a2e' : '#59617e');
  bg.addColorStop(0.5, night ? '#1c2440' : '#767f9c');
  bg.addColorStop(1, night ? '#0e1322' : '#454c66');
  g.fillStyle = bg; g.fillRect(x0, H * 0.05, bw, H * 0.95);
  const cols = Math.max(3, Math.floor(bw / 26)), rows = Math.max(4, Math.floor(H * 0.9 / 30));
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const lit = rng.chance(night ? 0.42 : 0.10);
    g.fillStyle = lit ? U.mix('#ffd98a', '#9fe4ff', rng.next()) : (night ? 'rgba(255,255,255,.05)' : 'rgba(20,26,44,.35)');
    g.fillRect(x0 + 10 + i * (bw - 20) / cols, H * 0.10 + j * (H * 0.86) / rows, (bw - 20) / cols - 7, (H * 0.86) / rows - 10);
  }
  if (night && rng.chance(0.5)) { g.fillStyle = '#ff3b5c'; g.beginPath(); g.arc(W / 2, H * 0.045, 4, 0, Math.PI * 2); g.fill(); }
  return sprite(c, rng.range(1.0, 1.8));
};

Art.lamp = function (night) {
  const W = 120, H = 320;
  const c = cvs(W, H), g = c.getContext('2d');
  g.strokeStyle = '#4a5064'; g.lineWidth = 8; g.lineCap = 'round';
  g.beginPath(); g.moveTo(W * 0.78, H); g.lineTo(W * 0.78, H * 0.12);
  g.quadraticCurveTo(W * 0.78, H * 0.04, W * 0.40, H * 0.05); g.stroke();
  if (night) {
    g.save(); g.globalAlpha = 0.55;
    const gr = g.createRadialGradient(W * 0.40, H * 0.08, 2, W * 0.40, H * 0.08, 70);
    gr.addColorStop(0, 'rgba(255,220,150,.95)'); gr.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(W * 0.40, H * 0.08, 70, 0, Math.PI * 2); g.fill(); g.restore();
  }
  g.fillStyle = night ? '#ffe6b0' : '#8d93a6';
  rr(g, W * 0.30, H * 0.04, 30, 9, 4); g.fill();
  return sprite(c, 0.34);
};

Art.gantry = function (label) {

/* nahtlos kachelbare Bergkette (Endpunkte identisch) */
Art.mountains = function (seed, w, h, colTop, colBot, snow, rough) {
  const rng = HR.RNG(seed);
  const c = cvs(w, h), g = c.getContext('2d');
  const n = 128; const pts = new Array(n + 1);
  pts[0] = pts[n] = h * 0.62;
  (function disp(a, b, d) {
    if (b - a < 2) return;
    const m = (a + b) >> 1;
    pts[m] = (pts[a] + pts[b]) / 2 + rng.range(-d, d);
    disp(a, m, d * rough); disp(m, b, d * rough);
  })(0, n, h * 0.36);
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, colTop); gr.addColorStop(1, colBot);
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(0, h);
  for (let i = 0; i <= n; i++) g.lineTo(i * w / n, U.clamp(pts[i], h * 0.05, h * 0.95));
  g.lineTo(w, h); g.closePath(); g.fill();
  if (snow) {
    g.fillStyle = 'rgba(240,248,255,.85)';
    for (let i = 0; i < n; i++) {
      const y = U.clamp(pts[i], h * 0.05, h * 0.95);
      if (y < h * 0.36) {
        g.beginPath(); g.moveTo(i * w / n, y);
        g.lineTo((i + 1) * w / n, U.clamp(pts[i + 1], h * 0.05, h * 0.95));
        g.lineTo((i + 1) * w / n, y + h * 0.10); g.lineTo(i * w / n, y + h * 0.10);
        g.closePath(); g.fill();
      }
    }
  }
  return c;
};

Art.clouds = function (seed, w, h, col, alpha) {
  const rng = HR.RNG(seed);
  const c = cvs(w, h), g = c.getContext('2d');
  g.globalAlpha = alpha == null ? 0.6 : alpha;
  for (let i = 0; i < 16; i++) {
    const x = rng.range(w * 0.06, w * 0.94), y = rng.range(h * 0.15, h * 0.8), r = rng.range(h * 0.16, h * 0.42);
    const gr = g.createRadialGradient(x, y, 1, x, y, r);
    gr.addColorStop(0, col); gr.addColorStop(1, U.rgba('#ffffff', 0));
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(x, y, r * 1.8, r * 0.62, 0, 0, Math.PI * 2); g.fill();
  }
  return c;
};

  if (b.kinds.indexOf('palm') >= 0) mk('palm', 6, r => Art.palm(r));
  if (b.kinds.indexOf('pine') >= 0) mk('pine', 6, r => Art.pine(r, true, false));
  if (b.kinds.indexOf('pineSnow') >= 0) mk('pineSnow', 6, r => Art.pine(r, false, true));

  if (b.kinds.indexOf('bush') >= 0) mk('bush', 5, r => Art.bush(r, b.id === 'wueste' ? '#8a8a4a' : '#2c6b34'));
  if (b.kinds.indexOf('building') >= 0) mk('building', 7, r => Art.building(r, b.night));
  if (b.kinds.indexOf('lamp') >= 0) p.lamp = [Art.lamp(b.night)];
  if (b.kinds.indexOf('billboard') >= 0) mk('billboard', 5, r => Art.billboard(r));
  p.signL = [Art.sign(-1)]; p.signR = [Art.sign(1)];

/* ---------------------------------------------------------- Generator */
const L = { S: 24, M: 48, L: 96 };
const C = { E: 2.0, M: 4.0, H: 6.2, X: 8.5 };
const HILL = { L: 20, M: 42, H: 68 };

/* cfg = {segments, difficulty 0..1, biomes:[ids], traffic 0..1, name} */
HR.buildTrack = function (seedStr, cfg) {
  cfg = cfg || {};
  const rng = HR.RNG(seedStr);
  const target = cfg.segments || 1400;
  const diff = U.clamp(cfg.difficulty == null ? 0.4 : cfg.difficulty, 0, 1);

  /* Zonenabfolge */
  let ids = (cfg.biomes && cfg.biomes.length) ? cfg.biomes.slice() : null;
  if (!ids) { ids = rng.shuffle(BIOME_LIST.slice()).slice(0, rng.int(2, 3)); }
  const zones = ids.map(id => BIOMES[id] || BIOMES.kueste);

  const segs = [];
  let zoneIdx = 0;
  const lastY = () => segs.length === 0 ? 0 : segs[segs.length - 1].p2.world.y;

  function addSegment(curve, y) {
    const n = segs.length;
    segs.push({
      index: n,
      p1: { world: { x: 0, y: lastY(), z: n * SEG.LEN }, camera: {}, screen: {} },
      p2: { world: { x: 0, y: y, z: (n + 1) * SEG.LEN }, camera: {}, screen: {} },
      curve: curve,
      sprites: [], cars: [],
      alt: Math.floor(n / SEG.RUMBLE) % 2 === 1,
      b: zones[Math.min(zoneIdx, zones.length - 1)],
      fog: 1, clip: 0
    });
  }
  function addRoad(enter, hold, leave, curve, y) {
    const startY = lastY(), endY = startY + (y || 0) * SEG.LEN;
    const total = enter + hold + leave;
    for (let n = 0; n < enter; n++) addSegment(U.easeIn(0, curve, n / enter), U.easeInOut(startY, endY, n / total));
    for (let n = 0; n < hold; n++) addSegment(curve, U.easeInOut(startY, endY, (enter + n) / total));
    for (let n = 0; n < leave; n++) addSegment(U.easeInOut(curve, 0, n / leave), U.easeInOut(startY, endY, (enter + hold + n) / total));
  }

  /* Bausteine */
  function straight(len) { addRoad(len, len, len, 0, 0); }
  function curveP(len, cv, hl) { addRoad(len, len, len, cv, hl); }
  function sCurve(len, cv) { addRoad(len, len, len, -cv, rng.range(-10, 10)); addRoad(len, len, len, cv, rng.range(-10, 10)); }
  function hills(len, h) {
    addRoad(len, len, len, 0, h); addRoad(len, len, len, 0, -h);
  }
  function bumps(n) {
    for (let i = 0; i < n; i++) addRoad(6, 6, 6, 0, rng.range(-6, 6));
  }

  /* Startgerade – dort steht der Zielbogen und die Startaufstellung */
  straight(L.M);

  const zoneLen = Math.floor((target - 220) / zones.length);
  while (segs.length < target - 130) {
    zoneIdx = U.clamp(Math.floor((segs.length - 60) / zoneLen), 0, zones.length - 1);
    const hard = diff;
    const kind = rng.weighted([
      { w: 3.2 - hard * 2.0, v: 'straight' },
      { w: 2.6, v: 'easy' },
      { w: 1.6 + hard * 1.4, v: 'med' },
      { w: 0.4 + hard * 2.4, v: 'hard' },
      { w: 1.0 + hard * 1.0, v: 's' },
      { w: 1.5, v: 'hill' },
      { w: 0.9 + hard * 1.1, v: 'curveHill' },
      { w: 0.5 + hard * 0.8, v: 'bumps' }
    ]);
    const len = rng.pick([L.S, L.M, L.M, L.L]);
    const dir = rng.sign();
    switch (kind) {
      case 'straight':  straight(len); break;
      case 'easy':      curveP(len, dir * C.E, 0); break;
      case 'med':       curveP(len, dir * C.M, rng.range(-12, 12)); break;
      case 'hard':      curveP(rng.pick([L.S, L.M]), dir * (diff > 0.7 ? C.X : C.H), rng.range(-14, 14)); break;
      case 's':         sCurve(L.S, dir * (C.E + hard * 3)); break;
      case 'hill':      hills(len, rng.pick([HILL.L, HILL.M, HILL.H])); break;
      case 'curveHill': curveP(len, dir * (C.E + hard * 3), rng.pick([HILL.L, HILL.M])); break;
      case 'bumps':     bumps(rng.int(3, 6)); break;
    }
  }

  /* Auslauf: Höhe sauber auf 0 zurück, damit der Rundenschluss nahtlos ist */
  zoneIdx = zones.length - 1;
  const back = -lastY() / SEG.LEN;
  addRoad(40, 40, 40, 0, back);
  straight(L.S);
  /* Segmentzahl auf ein Vielfaches der Randstreifen bringen */
  while (segs.length % (SEG.RUMBLE * 2) !== 0) addSegment(0, lastY());

  const total = segs.length;
  const trackLength = total * SEG.LEN;

  /* ------------------------------------------------ Bewuchs & Schilder */
  const startClear = 30;
  for (let n = startClear; n < total - 10; n++) {
    const s = segs[n], b = s.b, p = pool(b);
    /* Rand-Objekte */
    if (n % 2 === 0 && rng.chance(b.density * 0.55)) {
      const kind = rng.pick(b.kinds.filter(k => k !== 'sign'));
      const arr = p[kind === 'billboard' ? 'billboard' : kind];
      if (arr && arr.length) {
        const side = rng.chance(0.5) ? -1 : 1;
        const far = kind === 'building' ? rng.range(2.6, 5.5) : rng.range(1.15, 3.4);
        s.sprites.push({ s: rng.pick(arr), offset: side * far });
      }
    }
    /* dichte Waldkante */
    if (b.id === 'wald' && n % 4 === 0) {
      for (const side of [-1, 1]) {
        if (rng.chance(0.8)) s.sprites.push({ s: rng.pick(p.pine || p.leaf), offset: side * rng.range(1.1, 2.2) });
      }
    }
    /* Strassenlaternen in der Stadt, regelmässig */
    if (b.id === 'stadt' && n % 14 === 0 && p.lamp) {
      s.sprites.push({ s: p.lamp[0], offset: (n % 28 === 0 ? -1 : 1) * 1.25 });
    }
    /* Warnschild vor scharfen Kurven */
    const ahead = segs[Math.min(total - 1, n + 16)];
    if (Math.abs(ahead.curve) > 4.4 && Math.abs(s.curve) < 1.2 && n % 6 === 0 && rng.chance(0.55)) {
      const d = ahead.curve > 0 ? 1 : -1;
      s.sprites.push({ s: (d > 0 ? p.signR : p.signL)[0], offset: -d * 1.35 });
    }
  }
  /* Zielbogen */
  const gantry = Art.gantry('ZIEL');
  segs[Math.max(0, total - 24)].sprites.push({ s: gantry, offset: 0, center: true, arch: true });

  /* ------------------------------------------------ Wetter & Tageszeit */
  const lead = zones[0];
  const weather = rng.chance(lead.rain) ? (lead.snowfall ? 'snow' : 'rain') : 'clear';

  return {
    seed: seedStr,
    segments: segs,
    total: total,
    trackLength: trackLength,
    zones: zones,
    weather: weather,
    name: cfg.name || (zones.map(z => z.name).join(' · ')),
    findSegment(z) { return segs[Math.floor(z / SEG.LEN) % total]; }
  };
};

    this.render();
    this.updateHud(dt);

    /* Zeichenweite an die Leistung anpassen */
    if (HR.Save.data.settings.quality === 'auto') {
      if (this.frameAvg > 21 && this.drawDist > 95) this.drawDist -= 2;
      else if (this.frameAvg < 14.5 && this.drawDist < 230) this.drawDist += 1;
    } else {
      this.drawDist = HR.Save.data.settings.quality === 'high' ? 230 : HR.Save.data.settings.quality === 'low' ? 110 : 180;
    }
  },

  /* ---------------------------------------------------------- Physik */
  update(dt) {
    const T = this.track, cfg = this.cfg, S = HR.Save.data;

    if (this.state === 'countdown') {
      this.cdT -= dt;
      const n = Math.ceil(this.cdT - 0.6);
      if (n !== this._cdShown) {
        this._cdShown = n;
        if (n > 0 && n <= 3) { this.big(String(n)); HR.Audio.countdown(false); }
      }
      if (this.cdT <= 0.6 && !this._go) { this._go = true; this.big('LOS!'); HR.Audio.countdown(true); }
      if (this.cdT <= 0) { this.state = 'racing'; this.big(''); }
      /* Motor im Leerlauf */
      HR.Audio.engine(0.18 + Math.random() * 0.04, 0.2, true, false);
      this.updateCars(dt, true);
      return;
    }
    if (this.state !== 'racing') return;

    this.time += dt; this.raceTime += dt;

    const playerSeg = T.findSegment(this.position + PLAYER_Z);
    const speedPct = this.speed / this.maxSpeed;
    const assist = S.settings.assist ? 0.78 : 1;

    /* --- Lenken --- */
    let steer = this.input.useTilt ? this.input.tilt : this.input.steer;
    if (this.input.kl) steer = -1; if (this.input.kr) steer = 1;
    this.steerSmooth = U.lerp(this.steerSmooth || 0, steer, 1 - Math.pow(0.0006, dt));
    const dx = dt * 2.1 * Math.max(0.22, speedPct);
    this.playerX += this.steerSmooth * dx * (0.72 + this.stats.grip * 0.42);

    /* Fliehkraft in Kurven */
    const centri = 0.34 * (1.30 - this.stats.grip * 0.55) * assist;
    this.playerX -= dx * speedPct * playerSeg.curve * centri;

    /* Driftwert – daraus Rauch, Ton und Stilpunkte */
    const want = Math.abs(playerSeg.curve) * speedPct * 0.115;
    const slipRaw = U.clamp(want - this.stats.grip * 0.42 + Math.abs(this.steerSmooth) * speedPct * 0.16 - 0.10, 0, 1);
    this.slip = U.lerp(this.slip, slipRaw, 0.16);

    /* Kurvengrenze: über dem Grip schiebt der Wagen nach aussen und die
       Reifen radieren Tempo weg. Genau deshalb muss man vor der Kurve
       bremsen statt einfach durchzuhalten. */
    if (this.slip > 0.24) {
      const over = this.slip - 0.24;
      this.speed -= this.maxSpeed * over * 0.62 * dt;
      this.playerX -= Math.sign(playerSeg.curve) * over * dt * 1.5;
      if (this.slip > 0.55) this.shake = Math.max(this.shake, (this.slip - 0.55) * 0.9);
    }

    /* --- Gas / Bremse --- */
    const autoGas = S.settings.autoGas;
    const braking = !!this.input.brake;
    const gas = autoGas ? !braking : !!this.input.gas;
    const nosReady = this.nos > 0.02 && this.input.nos;
    this.nosOn = nosReady;

    const boost = nosReady ? 1 + 0.20 * this.stats.nos : 1;
    const vmax = this.maxSpeed * boost;
    const vRel = this.speed / this.maxSpeed;
    if (braking) {
      /* Verzögerung als feste Rate, nicht als Anteil des Tempos: aus 250 km/h
         dauert eine Vollbremsung rund 3,5 s. Guter Grip bremst kürzer. */
      const brake = (1500 + this.stats.grip * 1100) * (S.settings.assist ? 1.15 : 1);
      this.speed -= brake * dt;
    } else if (gas) {
      const p = U.clamp(this.speed / vmax, 0, 1);
      const a = (this.maxSpeed / (4.6 + 7.0 * (1 - this.stats.acc))) * (1 - Math.pow(p, 2.4)) * (nosReady ? 1.55 : 1);
      this.speed += a * dt;
    } else {
      /* Ausrollen: Rollwiderstand plus quadratischer Luftwiderstand */
      this.speed -= (this.maxSpeed * 0.035 + this.maxSpeed * 0.075 * vRel * vRel) * dt;
    }

    /* Nebenstrecke */
    const offroad = Math.abs(this.playerX) > 1;
    if (offroad) {
      const lim = this.maxSpeed * (S.settings.assist ? 0.44 : 0.34);
      if (this.speed > lim) this.speed -= this.maxSpeed * 1.5 * dt;
      this.shake = Math.max(this.shake, 0.35 * speedPct);
      if (Math.abs(this.playerX) > 2.4) {          /* Leitplanke */
        this.playerX = 2.4 * Math.sign(this.playerX);
        this.speed *= 0.965;
      }
    }
    this.speed = U.clamp(this.speed, 0, vmax);
    this.playerX = U.clamp(this.playerX, -2.6, 2.6);

    /* NOS-Haushalt */
    if (nosReady) {
      this.nos = Math.max(0, this.nos - dt * 0.30);
      if (!this._nosSnd) { HR.Audio.nosBurst(); this._nosSnd = true; }
    } else { this._nosSnd = false; }
    this.nos = Math.min(1, this.nos + dt * 0.014 + this.slip * dt * 0.055);
    if (this.slip > 0.32) { this.driftTime += dt; this.addScore(38 * dt * speedPct, null); }

    /* Kombo verfällt, wenn längere Zeit nichts passiert */
    this.comboT -= dt;
    if (this.comboT <= 0 && this.combo > 0) this.combo = 0;

    /* --- Vorwärts --- */
    const prevPos = this.position;
    this.position = U.increase(this.position, dt * this.speed, T.trackLength);
    this.distance += dt * this.speed;
    if (this.speed / 40 > this.topSpeed) this.topSpeed = this.speed / 40;

    /* Rundenwechsel / neue Etappe */
    if (this.position < prevPos) this.onLap();

    /* Kollisionen */
    this.checkCollisions(playerSeg, dt);

    /* Kamera-Nicken aus der Steigung */
    const slope = (playerSeg.p2.world.y - playerSeg.p1.world.y) / SEG.LEN;
    this.pitch = U.lerp(this.pitch, slope, 0.08);
    this.shake = Math.max(0, this.shake - dt * 1.6);

    this.updateCars(dt, false);
    this.updateRank();

    /* Modus-Logik */
    if (cfg.mode === 'marathon') {
      this.timeLeft -= dt;
      const q = T.trackLength / 4;
      const cpZ = (this.nextCp + 1) * q;
      if (this.position >= cpZ && this.nextCp < 3) {
        this.nextCp++;
        const add = Math.max(9, 22 - this.stage * 0.8);
        this.timeLeft += add;
        HR.Audio.checkpoint();
        this.pop('+' + Math.round(add) + ' SEK', '#22e6c8');
        this.addScore(250, 'CHECKPOINT');
      }
      if (this.timeLeft <= 0) { this.finish(false); return; }
    }
    if (cfg.mode === 'trap') {
      const n = cfg.traps || 4;
      const q = T.trackLength / n;
      if (this.trapCount < n && this.position >= (this.trapCount + 0.5) * q) {
        this.trapCount++;
        const kmh = Math.round(this.speed / 40);
        this.trapTotal += kmh;
        HR.Audio.checkpoint();
        this.pop('BLITZER ' + kmh + ' km/h', '#ffcc33');
        this.addScore(kmh * 10, null);
      }
    }

    /* Ton */
    const rpmBase = (this.speed / this.maxSpeed);
    const gear = Math.min(6, 1 + Math.floor(rpmBase * 6));
    const rpm = U.clamp((rpmBase * 6) % 1 * 0.75 + 0.25, 0, 1);
    HR.Audio.engine(rpm, gas ? 1 : 0.25, true, this.nosOn);
    HR.Audio.wind(speedPct, this.slip > 0.42);
    this.gear = gear;

    /* Rauchpartikel */
    if (this.slip > 0.30 && Math.random() < 0.6) this.spawnSmoke();
    for (let i = this.smoke.length - 1; i >= 0; i--) {
      const p = this.smoke[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 90;
      if (p.life <= 0) this.smoke.splice(i, 1);
    }
  },

  onLap() {
    const cfg = this.cfg;
    if (cfg.mode === 'marathon') {
      this.stage++;
      this.nextCp = 0;
      this.buildStage(cfg.seed);
      this.pop('ETAPPE ' + (this.stage + 1) + ' · ' + this.track.zones[0].name, '#ff6a1f');
      this.big('ETAPPE ' + (this.stage + 1)); setTimeout(() => this.big(''), 1400);
      return;
    }
    this.lap++;
    if (this.lap >= (cfg.laps || 1)) { this.finish(true); return; }
    HR.Audio.checkpoint();
    this.pop('RUNDE ' + (this.lap + 1) + '/' + cfg.laps, '#ffffff');
  },

  spawnSmoke() {
    const W = this.W, H = this.H;
    const sx = W / 2 + (Math.random() - 0.5) * W * 0.22;
    this.smoke.push({
      x: sx, y: H * 0.90 + Math.random() * H * 0.03, r: 8 * this.res,
      vx: (Math.random() - 0.5) * 90, vy: -20 - Math.random() * 40,
      life: 0.55 + Math.random() * 0.35, max: 0.9
    });
    if (this.smoke.length > 60) this.smoke.shift();
  },

  /* --------------------------------------------------- Gegner & Verkehr */
  updateCars(dt, frozen) {
    const T = this.track, len = T.trackLength;
    const playerDist = this.lap * len + this.position;
    const rubber = HR.Save.data.settings.rubber;

    for (const c of this.cars) {
      const seg = T.findSegment(c.z);

      if (c.rival) {
        if (frozen) { c.speed = 0; }
        else {
          /* Wunschtempo: Basistempo, in Kurven langsamer */
          const cv = Math.abs(seg.curve);
          const corner = 1 - Math.min(0.46, cv * 0.055 * (1.3 - c.skill * 0.55));
          let want = c.base * corner;
          if (c.mistake > 0) { want *= 0.84; c.mistake -= dt; }
          else if (Math.random() < 0.0016 * (1.15 - c.skill)) c.mistake = 0.5 + Math.random() * 1.1;
          /* Gummiband: hält das Feld spannend, aber gedeckelt */
          if (rubber) {
            const gap = playerDist - (c.lap * len + c.z);
            want *= 1 + U.clamp(gap / 52000, -1, 1) * (gap > 0 ? 0.085 : 0.055);
          }
          c.speed = U.lerp(c.speed, want, 1 - Math.pow(0.15, dt));
          /* Ideallinie + Ausweichen */
          let target = -Math.sign(seg.curve) * Math.min(0.55, cv * 0.09) + (c.line || 0);
          for (const o of this.cars) {
            if (o === c) continue;
            const d = o.z - c.z;
            if (d > 0 && d < 2400 && Math.abs(o.offset - c.offset) < 0.42) target += (c.offset > o.offset ? 0.5 : -0.5);
          }
          const pd = (this.position + PLAYER_Z) - c.z;
          if (pd < 0 && pd > -2200 && Math.abs(this.playerX - c.offset) < 0.4) target += (c.offset > this.playerX ? 0.42 : -0.42);
          c.wanted = U.clamp(target, -0.88, 0.88);
          c.offset = U.lerp(c.offset, c.wanted, 1 - Math.pow(0.25, dt));
        }
      } else {
        /* Verkehr: gleichmässig, weicht leicht aus */
        if (!frozen) {
          const pd = (this.position + PLAYER_Z) - c.z;
          if (pd < 0 && pd > -1800 && Math.abs(this.playerX - c.offset) < 0.32) {
            c.offset += (c.offset > this.playerX ? 1 : -1) * dt * 0.55;
            c.offset = U.clamp(c.offset, -0.85, 0.85);
          }
        }
      }

      if (!frozen) {
        const before = c.z;
        c.z = U.increase(c.z, dt * c.speed, len);
        if (c.z < before) c.lap++;
      }
      c.percent = U.pctRemaining(c.z, SEG.LEN);
      c.dist = c.lap * len + c.z;
      const ns = T.findSegment(c.z);
      if (ns !== c.seg) {
        if (c.seg) { const i = c.seg.cars.indexOf(c); if (i >= 0) c.seg.cars.splice(i, 1); }
        ns.cars.push(c); c.seg = ns;
      }
    }
  },

  updateRank() {
    const len = this.track.trackLength;
    const my = this.lap * len + this.position;
    let ahead = 0, total = 0;
    for (const c of this.cars) { if (!c.rival) continue; total++; if (c.dist > my) ahead++; }
    this.place = ahead + 1; this.fieldSize = total + 1;
  },

  checkCollisions(playerSeg, dt) {
    /* Die Trefferfläche entspricht der wirklich gezeichneten Wagenbreite,
       damit knappes Vorbeiziehen auch wirklich vorbeigeht. */
    const T = this.track, myZ = this.position + PLAYER_Z;
    for (let k = -1; k <= 3; k++) {
      const seg = T.segments[((playerSeg.index + k) % T.total + T.total) % T.total];
      for (const c of seg.cars) {
        const half = (c.sprite.worldW + PLAYER_W) * 0.5;      /* Berührung ab hier */
        let dz = c.z - myZ;
        if (dz < -T.trackLength / 2) dz += T.trackLength;      /* Rundenschluss */
        else if (dz > T.trackLength / 2) dz -= T.trackLength;
        if (dz > CAR_LEN * 1.7 || dz < -CAR_LEN) continue;
        const dxo = Math.abs(this.playerX - c.offset);
        if (dxo < half * 0.94 && dz < CAR_LEN && dz > -CAR_LEN * 0.5 && this.speed > c.speed) {
          /* Aufprall */
          this.speed = Math.max(c.speed * 0.72, this.maxSpeed * 0.18);
          this.playerX += (this.playerX > c.offset ? 1 : -1) * 0.22;
          this.shake = 1; this.combo = 0;
          HR.Audio.crash(); HR.buzz(45);
          this.pop('RUMMS!', '#ff3b5c');
          c.speed *= 0.9;
        } else if (dxo < half * 2.1 && dz < CAR_LEN * 1.6 && dz > -CAR_LEN && this.speed > c.speed * 1.06 && !c._nm) {
          /* Beinahe-Berührung – knapper Vorbeizug lädt NOS */
          c._nm = true;
          this.combo++;
          this.comboT = 3.5;
          this.nearMiss++;
          this.nos = Math.min(1, this.nos + 0.10);
          this.addScore(60 * Math.min(6, this.combo), 'FAST BERÜHRT ×' + this.combo);
          setTimeout(() => { c._nm = false; }, 1400);
        }
      }
    }
    /* Landschaft am Fahrbahnrand */
    if (Math.abs(this.playerX) > 1.05 && this.speed > this.maxSpeed * 0.25) {
      for (const sp of playerSeg.sprites) {
        if (sp.center) continue;
        const w = sp.s.worldW;
        const a = sp.offset, b = sp.offset + (sp.offset > 0 ? w : -w);
        const lo = Math.min(a, b), hi = Math.max(a, b);
        if (this.playerX + 0.2 > lo && this.playerX - 0.2 < hi) {
          this.speed = this.maxSpeed * 0.28;
          this.shake = 1.2; this.combo = 0;
          HR.Audio.crash(); HR.buzz(70);
          this.pop('AUA!', '#ff3b5c');
          this.playerX = U.clamp(this.playerX, -0.95, 0.95);
          break;
        }
      }
    }
  },

  addScore(n, label) {
    this.score += n;
    if (label) this.pop('+' + Math.round(n) + ' ' + label, '#ffcc33');
  },

  /* ---------------------------------------------------------- Ende */
  finish(completed) {
    if (this.state === 'finished') return;
    this.state = 'finished';
    this.dom.controls.hidden = true;
    HR.Audio.stopEngine();
    const cfg = this.cfg, len = this.track.trackLength;
    const my = this.lap * len + this.position;

    /* Endstand: verbleibende Distanz der Gegner in Zeit umrechnen */
    const stand = [{ me: true, name: 'DU', col: '#ff6a1f', t: this.raceTime, dist: my }];
    for (const c of this.cars) {
      if (!c.rival) continue;
      const behind = my - c.dist;
      stand.push({ me: false, name: c.name, col: c.col, dist: c.dist, t: this.raceTime + behind / Math.max(1, c.speed || c.base) });
    }
    stand.sort((a, b) => a.t - b.t);
    const place = stand.findIndex(s => s.me) + 1;

    const res = this.result = {
      mode: cfg.mode, eventId: cfg.eventId, name: cfg.name,
      completed: completed,
      place: place, of: stand.length,
      time: this.raceTime,
      km: this.distance / UNITS_PER_KM,
      distance: this.distance,
      score: Math.round(this.score + this.distance / 900 + this.driftTime * 55 + this.nearMiss * 40),
      stage: this.stage,
      trapTotal: this.trapTotal,
      topSpeed: Math.round(this.topSpeed),
      drift: Math.round(this.driftTime),
      nearMiss: this.nearMiss,
      standings: stand
    };
    this.big(cfg.mode === 'marathon' ? 'ZEIT ABGELAUFEN' : 'ZIEL');
    setTimeout(() => { this.big(''); if (this.onFinish) this.onFinish(res); }, 1300);
  },

  big(t) { this.dom.big.textContent = t; if (t) { this.dom.big.classList.remove('pulse'); void this.dom.big.offsetWidth; this.dom.big.classList.add('pulse'); } },
  pop(text, col) {
    const d = document.createElement('div');
    d.className = 'pop'; d.textContent = text; d.style.color = col || '#fff';
    this.dom.pops.appendChild(d);
    setTimeout(() => d.remove(), 1100);
    if (this.dom.pops.childElementCount > 6) this.dom.pops.firstChild.remove();
  },

  /* ---------------------------------------------------------- HUD */
  updateHud(dt) {
    this._hudT = (this._hudT || 0) + dt;
    const d = this.dom;
    d.rev.style.width = (U.clamp(((this.speed / this.maxSpeed) * 6) % 1 * 0.7 + 0.3, 0, 1) * 100) + '%';
    d.nos.style.width = (this.nos * 100) + '%';
    if (this._hudT < 0.06) return;
    this._hudT = 0;
    d.kmh.textContent = Math.round(this.speed / 40);
    if (!d.chipPos.hidden) d.chipPos.querySelector('.v').innerHTML = '<b>' + (this.place || 1) + '</b>/' + (this.fieldSize || 1);
    if (!d.chipLap.hidden) d.chipLap.querySelector('.v').innerHTML = '<b>' + Math.min(this.lap + 1, this.cfg.laps) + '</b>/' + this.cfg.laps;
    if (this.cfg.mode === 'marathon') {
      d.chipTime.querySelector('.k').textContent = 'Restzeit';
      d.chipTime.querySelector('.v').textContent = U.fmtClock(Math.max(0, this.timeLeft));
      d.chipTime.style.color = this.timeLeft < 8 ? '#ff3b5c' : '';
      d.chipExtra.querySelector('.k').textContent = 'Distanz';
      d.chipExtra.querySelector('.v').textContent = (this.distance / UNITS_PER_KM).toFixed(2) + ' km';
    } else {
      d.chipTime.querySelector('.k').textContent = 'Zeit';
      d.chipTime.style.color = '';
      d.chipTime.querySelector('.v').textContent = U.fmtTime(this.raceTime);
      if (this.cfg.mode === 'trap') {
        d.chipExtra.querySelector('.k').textContent = 'Blitzer';
        d.chipExtra.querySelector('.v').textContent = this.trapTotal + ' km/h';
      }
    }
    this.drawMini();
  },

  /* Vorausschau statt Gesamtkarte: die nächsten rund 180 Segmente, immer
     nach oben ausgerichtet, eingefärbt nach Kurvenschärfe.
     Das entspricht bei Vollgas etwa der Strecke einer Vollbremsung. */
  drawMini() {
    const g = this.miniG; if (!g) return;
    const c = this.miniCv, w = c.width, h = c.height;
    const T = this.track, base = T.findSegment(this.position + PLAYER_Z).index;
    const STEP = 3, N = 60, K = 0.0062;
    g.clearRect(0, 0, w, h);

    const P = [[0, 0, 0]];
    let head = 0, x = 0, y = 0;
    for (let k = 0; k < N; k++) {
      let cmax = 0;
      for (let j = 0; j < STEP; j++) {
        const s = T.segments[(base + k * STEP + j) % T.total];
        head += s.curve * K; x += Math.sin(head); y += Math.cos(head);
        if (Math.abs(s.curve) > cmax) cmax = Math.abs(s.curve);
      }
      P.push([x, y, cmax]);
    }
    const pad = 13, sc = (h - pad * 2) / (N * STEP);
    const X = i => w / 2 + P[i][0] * sc, Y = i => h - pad - P[i][1] * sc;

    /* dunkler Unterzug */
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.lineWidth = 11; g.strokeStyle = 'rgba(0,0,0,.5)';
    g.beginPath(); g.moveTo(X(0), Y(0));
    for (let i = 1; i <= N; i++) g.lineTo(X(i), Y(i));
    g.stroke();

    /* Fahrbahn, in Läufen gleicher Schärfe gezeichnet */
    const colOf = cv => cv > 4.6 ? '#ff3b5c' : cv > 2.6 ? '#ffcc33' : 'rgba(255,255,255,.82)';
    g.lineWidth = 6.5;
    let i = 1;
    while (i <= N) {
      const col = colOf(P[i][2]);
      g.strokeStyle = col;
      g.beginPath(); g.moveTo(X(i - 1), Y(i - 1));
      while (i <= N && colOf(P[i][2]) === col) { g.lineTo(X(i), Y(i)); i++; }
      g.stroke();
    }

    /* Fahrzeuge in Reichweite */
    for (const car of this.cars) {
      if (!car.rival && !car.big) continue;
      const di = (((car.seg ? car.seg.index : 0) - base) % T.total + T.total) % T.total;
      if (di > N * STEP) continue;
      const k = Math.round(di / STEP);
      g.fillStyle = car.rival ? car.col : 'rgba(190,196,214,.9)';
      g.beginPath(); g.arc(X(k), Y(k), car.rival ? 3.4 : 2.6, 0, Math.PI * 2); g.fill();
    }

    /* Ferne ausblenden – gibt der Vorausschau Tiefe */
    g.globalCompositeOperation = 'destination-out';
    const fade = g.createLinearGradient(0, 0, 0, h * 0.42);
    fade.addColorStop(0, 'rgba(0,0,0,.8)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = fade; g.fillRect(0, 0, w, h * 0.42);
    g.globalCompositeOperation = 'source-over';

    /* eigener Wagen als Pfeil am unteren Rand */
    const px = X(0), py = Y(0);
    g.fillStyle = '#ff6a1f'; g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(px, py - 7); g.lineTo(px + 5.2, py + 4); g.lineTo(px, py + 1.6); g.lineTo(px - 5.2, py + 4);
    g.closePath(); g.fill(); g.stroke();
  },

  /* ---------------------------------------------------------- Rendern */
  render() {
    const g = this.g, W = this.W, H = this.H, T = this.track;
    const segs = T.segments, total = T.total;

    const baseSeg = T.findSegment(this.position);
    const basePct = U.pctRemaining(this.position, SEG.LEN);
    const playerSeg = T.findSegment(this.position + PLAYER_Z);
    const playerPct = U.pctRemaining(this.position + PLAYER_Z, SEG.LEN);
    const playerY = U.lerp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);
    const speedPct = this.speed / this.maxSpeed;

    /* Bildschirmzittern */
    let shx = 0, shy = 0;
    if (this.shake > 0.01) {
      shx = (Math.random() - 0.5) * this.shake * 22 * this.res;
      shy = (Math.random() - 0.5) * this.shake * 16 * this.res;
    }
    g.setTransform(1, 0, 0, 1, shx, shy);

    const horizon = H * CY - this.pitch * H * 0.42;
    this.bgOff[0] = U.increase(this.bgOff[0], -baseSeg.curve * speedPct * 0.00042, 1);
    this.bgOff[1] = U.increase(this.bgOff[1], -baseSeg.curve * speedPct * 0.0011, 1);
    this.bgOff[2] = U.increase(this.bgOff[2], -baseSeg.curve * speedPct * 0.0020, 1);

    this.renderBackground(g, W, H, horizon, baseSeg.b, playerY);

    /* --- Strassensegmente --- */
    let maxy = H, x = 0, dxx = -(baseSeg.curve * basePct);
    const dd = this.drawDist;
    const camY = playerY + CAM_H;
    for (let n = 0; n < dd; n++) {
      const s = segs[(baseSeg.index + n) % total];
      s.looped = s.index < baseSeg.index;
      const t = n / dd;
      s.fog = Math.exp(-FOG_DENSITY * t * t);
      s.clip = maxy;
      const camZ = this.position - (s.looped ? T.trackLength : 0);
      project(s.p1, (this.playerX * SEG.ROAD_W) - x, camY, camZ, W, H);
      project(s.p2, (this.playerX * SEG.ROAD_W) - x - dxx, camY, camZ, W, H);
      x += dxx; dxx += s.curve;

      if (s.p1.camera.z <= CAM_DEPTH || s.p2.screen.y >= s.p1.screen.y || s.p2.screen.y >= maxy) continue;

    }

    /* Dunst in der Ferne – ein einziger Verlauf statt einer Füllung je Segment

    const fogTop = Math.max(0, maxy);
    const fogBot = Math.min(H, fogTop + (H - fogTop) * 0.62);
    if (fogBot > fogTop + 2) {
      const fg = g.createLinearGradient(0, fogTop, 0, fogBot);
      fg.addColorStop(0, U.rgba(baseSeg.b.fog, 0.92));
      fg.addColorStop(0.45, U.rgba(baseSeg.b.fog, 0.42));
      fg.addColorStop(1, U.rgba(baseSeg.b.fog, 0));
      g.fillStyle = fg; g.fillRect(0, fogTop, W, fogBot - fogTop);

    for (let n = dd - 1; n > 0; n--) {

        const sx = U.lerp(s.p1.screen.x, s.p2.screen.x, c.percent) + sc * c.offset * SEG.ROAD_W * W / 2;
        const sy = U.lerp(s.p1.screen.y, s.p2.screen.y, c.percent);
        drawSprite(g, W, c.sprite, sc, sx, sy, -0.5, -1, s.clip, s.fog);
      }
      for (const sp of s.sprites) {

        const sx = s.p1.screen.x + sc * sp.offset * SEG.ROAD_W * W / 2;
        const sy = s.p1.screen.y;
        drawSprite(g, W, sp.s, sc, sx, sy, sp.center ? -0.5 : (sp.offset < 0 ? -1 : 0), -1, s.clip, s.fog);
      }

    }

    this.renderWeather(g, W, H);
    this.renderFx(g, W, H, speedPct);

  },

  renderBackground(g, W, H, horizon, b, playerY) {

    sky.addColorStop(0, b.sky[0]); sky.addColorStop(0.62, b.sky[1]); sky.addColorStop(1, b.sky[2]);
    g.fillStyle = sky; g.fillRect(0, 0, W, Math.max(0, horizon));

    }
    g.restore();
  },

  renderFx(g, W, H, speedPct) {

    if (this.nosOn) {
      g.save();
      g.strokeStyle = 'rgba(140,230,255,.5)'; g.lineWidth = 2 * this.res;
      for (let i = 0; i < 22; i++) {
        const a = Math.random() * Math.PI * 2, r0 = Math.min(W, H) * (0.22 + Math.random() * 0.2), r1 = r0 + Math.min(W, H) * 0.22;
        g.beginPath();
        g.moveTo(W / 2 + Math.cos(a) * r0, H * 0.55 + Math.sin(a) * r0);
        g.lineTo(W / 2 + Math.cos(a) * r1, H * 0.55 + Math.sin(a) * r1);
        g.stroke();
      }
      g.restore();
    }
    /* Vignette – nimmt mit Tempo zu */
    const v = 0.24 + speedPct * 0.30;
    const vg = g.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.28, W / 2, H * 0.55, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,' + v.toFixed(2) + ')');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
  }
};

/* ---------------------------------------------------------- Projektion */
function project(p, camX, camY, camZ, W, H) {
  p.camera.x = (p.world.x || 0) - camX;
  p.camera.y = (p.world.y || 0) - camY;
  p.camera.z = (p.world.z || 0) - camZ;
  p.screen.scale = CAM_DEPTH / p.camera.z;
  p.screen.x = Math.round((W / 2) + (p.screen.scale * p.camera.x * W / 2));
  p.screen.y = Math.round((H * CY) - (p.screen.scale * p.camera.y * H / 2));
  p.screen.w = Math.round(p.screen.scale * SEG.ROAD_W * W / 2);
}

function poly(g, x1, y1, x2, y2, x3, y3, x4, y4, col) {
  g.fillStyle = col;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.lineTo(x4, y4); g.closePath(); g.fill();
}

function renderSegment(g, W, s) {
  const p1 = s.p1.screen, p2 = s.p2.screen, b = s.b, alt = s.alt;
  const x1 = p1.x, y1 = p1.y, w1 = p1.w, x2 = p2.x, y2 = p2.y, w2 = p2.w;
  const r1 = w1 / Math.max(6, 2 * SEG.LANES), r2 = w2 / Math.max(6, 2 * SEG.LANES);
  const l1 = w1 / Math.max(32, 8 * SEG.LANES), l2 = w2 / Math.max(32, 8 * SEG.LANES);

  g.fillStyle = alt ? b.grass[0] : b.grass[1];
  g.fillRect(0, y2, W, y1 - y2);

  const rc = alt ? b.rumble[0] : b.rumble[1];
  poly(g, x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, rc);
  poly(g, x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, rc);
  poly(g, x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, alt ? b.road[0] : b.road[1]);

  /* Mittellinien nur zeichnen, solange sie überhaupt sichtbar breit sind */
  if (alt && w1 > W * 0.055) {
    const lw1 = w1 * 2 / SEG.LANES, lw2 = w2 * 2 / SEG.LANES;
    let lx1 = x1 - w1 + lw1, lx2 = x2 - w2 + lw2;
    for (let i = 1; i < SEG.LANES; i++) {
      poly(g, lx1 - l1, y1, lx1 + l1, y1, lx2 + l2, y2, lx2 - l2, y2, b.lane);
      lx1 += lw1; lx2 += lw2;
    }
  }
}

function drawSprite(g, W, sp, scale, destX, destY, offX, offY, clipY, alpha) {
  if (scale <= 0) return;
  const destW = sp.worldW * SEG.ROAD_W * scale * W / 2;
  const destH = destW * (sp.h / sp.w);
  if (destW < 1 || destH < 1) return;
  const dx = destX + destW * (offX || 0);
  const dy = destY + destH * (offY || 0);
  const clipH = clipY ? Math.max(0, dy + destH - clipY) : 0;
  if (clipH >= destH) return;
  const a = alpha == null ? 1 : alpha;
  if (a < 0.02) return;
  if (a < 1) { g.save(); g.globalAlpha = a; }
  g.drawImage(sp.c, 0, 0, sp.w, sp.h - sp.h * clipH / destH, dx, dy, destW, destH - destH * clipH / destH);
  if (a < 1) g.restore();
}

/* Hintergrundebene waagrecht kacheln */
function tile(g, img, off, W, bottom, dw, dh, alpha) {
  const x0 = -((off % 1) * dw);
  const y = bottom - dh;
  if (alpha != null && alpha < 1) { g.save(); g.globalAlpha = alpha; }
  for (let x = x0 - dw; x < W + dw; x += dw) g.drawImage(img, x, y, dw, dh);
  if (alpha != null && alpha < 1) g.restore();
}
